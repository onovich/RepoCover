<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RepoCover GitHub repository social preview</title>
  <desc id="desc">RepoCover creates repository-specific social previews from real project evidence, with editable SVG, exact 1280 by 640 PNG output, and visual validation.</desc>
