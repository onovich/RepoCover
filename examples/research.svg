<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Research repository social preview</title>
  <desc id="desc">A dark green editorial cover with a reconstructed bilingual research spread, evidence ledger, and no webpage screenshot.</desc>

  <rect width="1280" height="640" fill="#062A22"/>
  <path d="M0 0h402c30 94 21 189-28 285-51 100-62 218-34 355H0z" fill="#0B372D"/>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace">
    <text x="64" y="80" fill="#63D6BE" font-size="14" font-weight="700" letter-spacing="3">RESEARCH / EVIDENCE-FIRST</text>
  </g>
  <text x="60" y="174" fill="#F7FAF7" font-family="Georgia, Times New Roman, serif" font-size="80" font-weight="700">Research</text>
  <text x="64" y="240" fill="#B7CEC8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">
    <tspan x="64" dy="0">Evidence-backed research,</tspan>
    <tspan x="64" dy="36">published in two languages.</tspan>
  </text>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">
    <rect x="64" y="362" width="12" height="12" rx="3" fill="#63D6BE"/>
    <text x="90" y="373" fill="#F7FAF7">01  QUESTION</text>
    <rect x="64" y="408" width="12" height="12" rx="3" fill="#2D7F70"/>
    <text x="90" y="419" fill="#B7CEC8">02  SOURCES</text>
    <rect x="64" y="454" width="12" height="12" rx="3" fill="#2D7F70"/>
    <text x="90" y="465" fill="#B7CEC8">03  FINDINGS</text>
    <rect x="64" y="500" width="12" height="12" rx="3" fill="#2D7F70"/>
    <text x="90" y="511" fill="#B7CEC8">04  LIMITS</text>
  </g>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace">
    <text x="64" y="588" fill="#76978F" font-size="12">github.com/onovich/Research</text>
  </g>

  <rect x="456" y="42" width="770" height="556" rx="32" fill="#EAF0EF"/>
  <rect x="456" y="42" width="770" height="12" rx="6" fill="#63D6BE"/>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-weight="700">
    <text x="506" y="99" fill="#006E60" font-size="13" letter-spacing="2.2">BILINGUAL RESEARCH REPORT</text>
    <rect x="1080" y="76" width="50" height="30" rx="15" fill="#D8E9E5"/>
    <text x="1097" y="96" fill="#18302D" font-size="12">EN</text>
    <rect x="1138" y="76" width="52" height="30" rx="15" fill="#18302D"/>
    <text x="1150" y="96" fill="#F7FAF7" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12">中文</text>
  </g>

  <text x="504" y="154" fill="#18302D" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700">One question. A clearer answer.</text>

  <rect x="504" y="184" width="314" height="248" rx="18" fill="#FBFDFC"/>
  <rect x="834" y="184" width="342" height="248" rx="18" fill="#F1F6F4"/>

  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="1.5">
    <text x="534" y="220" fill="#006E60">EN / FINDING</text>
    <text x="864" y="220" fill="#006E60">中文 / 结论</text>
  </g>

  <text x="532" y="266" fill="#18302D" font-family="Georgia, Times New Roman, serif" font-size="33" font-weight="700">
    <tspan x="532" dy="0">State what</tspan>
    <tspan x="532" dy="39">the sources</tspan>
    <tspan x="532" dy="39">support.</tspan>
  </text>
  <text x="862" y="278" fill="#18302D" font-family="STSong, Songti SC, Microsoft YaHei, serif" font-size="38" font-weight="700">
    <tspan x="862" dy="0">先讲结论，</tspan>
    <tspan x="862" dy="48">再看依据。</tspan>
  </text>

  <g fill="#C8D7D3">
    <rect x="534" y="354" width="222" height="8" rx="4"/>
    <rect x="534" y="376" width="178" height="8" rx="4"/>
    <rect x="864" y="354" width="250" height="8" rx="4"/>
    <rect x="864" y="376" width="192" height="8" rx="4"/>
  </g>
  <rect x="534" y="400" width="84" height="7" rx="3.5" fill="#63D6BE"/>
  <rect x="864" y="400" width="84" height="7" rx="3.5" fill="#63D6BE"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="506" y="468" fill="#536966" font-size="13" font-weight="700" letter-spacing="1">RESEARCH LEDGER</text>
  </g>
  <g font-family="Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">
    <rect x="504" y="490" width="208" height="62" rx="14" fill="#D8E9E5"/>
    <text x="526" y="517" fill="#006E60">PUBLIC SIGNALS</text>
    <text x="526" y="537" fill="#536966" font-weight="500" letter-spacing="0">what can be observed</text>

    <rect x="726" y="490" width="208" height="62" rx="14" fill="#C8D7D3"/>
    <text x="748" y="517" fill="#18302D">CONSTRAINTS</text>
    <text x="748" y="537" fill="#536966" font-weight="500" letter-spacing="0">what narrows the claim</text>

    <rect x="948" y="490" width="228" height="62" rx="14" fill="#18302D"/>
    <text x="970" y="517" fill="#63D6BE">BOUNDED RESULT</text>
    <text x="970" y="537" fill="#B7CEC8" font-weight="500" letter-spacing="0">what the evidence allows</text>
  </g>
</svg>
